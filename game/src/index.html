<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141922">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الحُكم</title>
<style>__STYLE__</style>
</head>
<body>
<div id="artdefs"></div>
<div id="app">

  <!-- The first thing the app shows. The setup wizard now sits behind it. -->
  <div class="menu" id="menu">
    <div class="mhead">
      <div class="mlogo">🏛️</div>
      <div class="mname">الحُكم</div>
      <div class="mline">إنت الرئيس. الأرقام هي اللي بتحكم.</div>
    </div>
    <div class="mbody" id="menuBody"></div>
  </div>

  <div class="setup hidden" id="setup">
    <div class="steps" id="steps"></div>
    <div class="body" id="setupBody"></div>
    <div class="foot" id="setupFoot"></div>
  </div>

  <div class="game hidden" id="game">
    <div class="top">
      <div class="trow">
        <div class="date" id="date"></div>
        <div class="clock">
          <button class="cbtn" id="pp" data-clock="pp">▶</button>
          <button class="cbtn" id="sp0" data-clock="0">×١</button>
          <button class="cbtn" id="sp1" data-clock="1">×٢</button>
          <button class="cbtn" id="sp2" data-clock="2">×٣</button>
        </div>
      </div>
      <div class="who" id="who"></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="view" id="view"></div>
    <div class="nav" id="nav"></div>
  </div>

</div>
<div class="ovl hidden" id="ovl"></div>
<!-- The situation card. Deliberately NOT inside #ovl: the overlay is the
     dismissible layer, and this one must not be dismissible by anything. -->
<div class="sit hidden" id="sit"></div>
<div class="toast" id="toast"></div>
<script>__ART__</script>
<script>__ENGINE__</script>
<script>__UI__</script>
</body>
</html>
