<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141922">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الحُكم</title>
<style>/* One dark theme only: this is a game screen, not a document. Every colour is
   explicit so it never borrows anything from the host page. */
:root{
  --bg:#0d0f14; --panel:#141922; --panel2:#1a1f2b; --line:#232a38; --line2:#2a3040;
  --ink:#e8e3d8; --dim:#7d8697; --dim2:#5d667a;
  --gold:#e8c87a; --gold2:#c9a24b;
  --good:#68d094; --warn:#e8c87a; --bad:#e07575; --info:#6fa8e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  direction:rtl; text-align:right;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}

/* ---------------------------------------------------------------- setup */
.setup{flex:1;display:flex;flex-direction:column;overflow:hidden}
.setup .steps{display:flex;gap:5px;padding:18px 18px 12px;flex:none}
.setup .sp{flex:1;height:3px;background:#1e2431;border-radius:2px;transition:background .3s}
.setup .sp.on{background:var(--gold2)} .setup .sp.done{background:#3d6b52}
.setup .body{flex:1;overflow-y:auto;padding:6px 18px 18px}
.setup .foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex:none;
  border-top:1px solid var(--panel2);display:flex;gap:8px}
.eyebrow{font-size:10px;color:var(--dim);letter-spacing:.12em;margin-bottom:6px}
h1{font-size:21px;font-weight:700;line-height:1.5;margin-bottom:6px}
.lede{font-size:12.5px;color:var(--dim);line-height:1.85;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:#8b93a5;margin-bottom:7px}
.field .wrap{display:flex;gap:7px}
input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:13px;color:var(--ink);font-family:inherit;font-size:15px;text-align:right;
  -webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--gold2)}
.dice{flex:0 0 46px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  color:var(--gold2);font-size:17px}
.opt{width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:14px;margin-bottom:9px;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--gold2);background:#191f29}
.opt .hd{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.opt .ic{font-size:20px} .opt .nm{font-size:15.5px;font-weight:700;flex:1}
.opt .tag{font-size:9.5px;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.opt.sel .tag{color:var(--gold);border-color:#4a3f22}
.opt .ds{font-size:11.5px;color:#8b93a5;line-height:1.85;margin-top:6px}
.opt .detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
.opt.sel .detail{max-height:400px}
.lst{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.li{font-size:11.5px;line-height:1.8;display:flex;gap:7px;margin-bottom:5px}
.li b{flex:none;font-weight:400}
.good b{color:var(--good)} .bad b{color:var(--bad)}
.feel{font-size:11px;color:var(--gold2);margin-top:10px;font-style:italic}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid #2c4a38;background:#182620;
  color:#8ee0ab;font-size:15px;font-weight:700}
.btn[disabled]{opacity:.35}
.btn.ghost{flex:0 0 92px;background:var(--panel);border-color:var(--line2);color:var(--dim);
  font-weight:400;font-size:13px}
.btn:active:not([disabled]){transform:scale(.98)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13px}
.srow .v{font-variant-numeric:tabular-nums;font-weight:700}
.srow .d{font-size:10.5px;margin-right:6px}
.up{color:var(--good)} .dn{color:var(--bad)}
.flag{background:#1d1712;border:1px solid #4a3a22;border-radius:11px;padding:10px 12px;
  font-size:11.5px;line-height:1.8;color:#c9a97a;margin-bottom:8px}
.title{background:linear-gradient(180deg,#1e2431,#171c26);border:1px solid #2e3648;border-radius:16px;
  padding:18px 14px;text-align:center;margin-bottom:12px}
.title .cn{font-size:19px;font-weight:700;margin-bottom:4px}
.title .rn{font-size:12px;color:var(--gold)}

/* ---------------------------------------------------------------- game */
.game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{padding:calc(10px + env(safe-area-inset-top)) 13px 9px;border-bottom:1px solid #1e2431;
  background:var(--panel);flex:none}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px}
.date{font-size:12px;color:#8b93a5;white-space:nowrap}
.date b{color:var(--gold);font-size:14px;font-variant-numeric:tabular-nums}
.who{font-size:10.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:9px}
.clock{display:flex;gap:4px;flex:none}
.cbtn{background:var(--panel2);border:1px solid var(--line2);color:#8b93a5;border-radius:7px;
  padding:4px 8px;font-size:11px;min-width:30px}
.cbtn.on{background:#1e2a22;border-color:#2c4a38;color:#8ee0ab}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mtr{text-align:center}
.mtr .lb{font-size:8.5px;color:var(--dim);display:block;margin-bottom:3px}
.mtr .vl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-bottom:3px}
.mtr .bar{height:3px;background:#0d1017;border-radius:2px;overflow:hidden}
.mtr .fl{height:100%;border-radius:2px;transition:width .4s,background .4s}
.mtr.danger{animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.band{position:relative;height:132px;overflow:hidden;background:var(--bg)}
.band svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* The band clips whatever leaves it, so both lines have to sit fully inside it.
   At bottom:-2px the subtitle's descenders were being sliced off — invisible in
   a diff, obvious the moment you look at the screen. */
.band .ttl{position:absolute;right:14px;bottom:24px;font-size:17px;font-weight:700;
  letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.band .sub{position:absolute;right:14px;bottom:8px;font-size:10px;line-height:1.5;color:var(--dim);
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
/* Sits on the artwork, so it needs its own dark plate to stay readable over a
   bright part of the scene. */
.band .back{position:absolute;top:10px;right:12px;background:rgba(9,12,18,.78);
  border:1px solid var(--line2);color:var(--ink);font-size:11.5px;font-weight:600;
  border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:5px;max-width:70%}
.band .back b{color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:13px;margin-bottom:9px;color:var(--ink);font-size:13.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right}
.jump span{font-size:11px;color:var(--dim);font-weight:400;line-height:1.7}
.pad{padding:14px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #1e2431;
  background:var(--panel);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;padding:9px 2px 11px;color:var(--dim2);font-size:9px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button i{font-style:normal;font-size:17px;opacity:.5}
.nav button.on{color:var(--gold)} .nav button.on i{opacity:1}
.soon{background:var(--panel);border:1px dashed #3a4457;border-radius:14px;padding:22px 16px;text-align:center}
.soon .ic{font-size:30px;display:block;margin-bottom:10px;opacity:.8}
.soon h3{font-size:15px;margin-bottom:7px}
.soon p{font-size:12px;color:var(--dim);line-height:1.9;max-width:34ch;margin:0 auto}
.soon .item{display:inline-block;margin-top:12px;font-size:10.5px;color:var(--gold2);
  border:1px solid #4a3f22;border-radius:20px;padding:3px 11px}
/* ---- cabinet board ---- */
.mrow{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;margin-bottom:9px}
.mhd{display:flex;align-items:center;gap:10px}
.mhd .mic{font-size:21px;flex:none;width:26px;text-align:center}
/* min-width:0 is what lets the ellipsis below actually kick in. Without it a
   long sub-line pushes the number off the edge of the card instead of
   truncating — the governor's row lost its number that way. */
.mhd .mnm{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.35}
.mhd .mof{display:block;font-size:10.5px;color:var(--dim);font-weight:400;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhd .mbig{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.mtag{display:inline-block;margin-top:8px;font-size:10px;border-radius:20px;padding:2px 9px;
  border:1px solid currentColor}
.mtag.good{color:var(--good)} .mtag.warn{color:var(--warn)} .mtag.bad{color:var(--bad)}
.mbars{display:flex;gap:14px;margin-top:9px}
.mb{flex:1;display:flex;align-items:center;gap:6px}
.mb span{font-size:10px;color:var(--dim);flex:none}
.mb b{font-size:11.5px;font-variant-numeric:tabular-nums;flex:none;min-width:2.2em;text-align:left}
.mbar{flex:1;height:4px;background:#0d1017;border-radius:2px;overflow:hidden}
.mfl{height:100%;border-radius:2px}
.mfoot{margin-top:8px;font-size:10.5px;color:var(--dim2);line-height:1.7}
button.mrow{width:100%;text-align:right;color:var(--ink);position:relative}
button.mrow .mgo{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:19px;color:var(--dim2)}
button.mrow .mhd{padding-left:16px}
.danger{width:100%;background:rgba(198,60,60,.09);border:1px solid #5d2a2a;border-radius:13px;
  padding:13px;margin-top:4px;color:#e8a0a0;font-size:13.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:right}
.danger span{font-size:11px;color:var(--dim);font-weight:400;line-height:1.7}
.danger:disabled{opacity:.5}
.dl{font-size:10px} .dl.up{color:var(--good)} .dl.dn{color:var(--bad)} .dl.same{color:var(--dim2)}
.sech{font-size:12px;color:var(--dim);margin:14px 2px 8px}
.lev{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px}
.lvtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lvtop .lvv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.lev input[type=range]{width:100%;accent-color:var(--gold2);height:22px}
.krow.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:8px;color:var(--ink)}
.seatbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:6px 0 4px;
  background:#0d1017}
.seatbar span{display:block;height:100%}
.prow .mbig{flex:none;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.prow{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.prow .mic{font-size:18px;flex:none;width:24px;text-align:center}
.prow .pnm{flex:1;font-size:13px;font-weight:700;line-height:1.35;min-width:0}
.prow .mof{display:block;font-size:10px;color:var(--dim);font-weight:400;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{flex:none;background:rgba(198,60,60,.12);border:1px solid #5d2a2a;border-radius:9px;
  padding:7px 13px;color:#e8a0a0;font-size:11.5px;font-weight:700}
.mini:disabled{opacity:.35}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}
.card h3{font-size:14px;margin-bottom:8px}
.krow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#9aa3b6}
.krow b{color:var(--ink);font-variant-numeric:tabular-nums}
.log{font-size:11.5px;color:var(--dim);line-height:1.9;border-right:2px solid var(--line2);
  padding-right:10px;margin-bottom:7px}

/* --------------------------------------------------------- service cards */
.svc{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:12px;margin-bottom:8px}
.svc .top1,.lev .lvtop{display:flex;align-items:center;gap:9px}
.svc .ico{font-size:17px;width:22px;text-align:center;flex:none}
.svc .nm2,.lev .nm2{flex:1;font-size:13.5px}
.svc .cost,.lev .cost{font-size:10.5px;color:var(--dim);display:block;margin-top:2px;line-height:1.6}
.svc .lvl{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.two2{display:flex;gap:7px;margin-top:8px}
.two2>div{flex:1}
.two2 .lb2{font-size:8.5px;color:var(--dim2);display:block;margin-bottom:3px}
.bar2{height:4px;background:#0d1017;border-radius:3px;overflow:hidden}
.fl2{height:100%;border-radius:3px;transition:width .3s}
.ctl{display:flex;align-items:center;gap:9px;margin-top:10px}
.ctl input[type=range]{flex:1;accent-color:var(--gold2);height:22px}
.ctl .pctv{font-size:12px;font-variant-numeric:tabular-nums;width:44px;text-align:left;color:var(--gold)}
.build{flex:none;background:var(--panel2);border:1px solid #2c3f5a;color:#8fbde0;
  border-radius:9px;padding:6px 10px;font-size:11px;font-family:inherit}
.build[disabled]{opacity:.4;border-color:var(--line)}
.hint{font-size:10px;color:var(--dim2);margin-top:7px;line-height:1.7}

.queue{background:var(--panel);border:1px dashed #3a4457;border-radius:13px;padding:11px;margin-top:4px}
.queue h4{margin:0 0 8px}
.qi{display:flex;justify-content:space-between;font-size:12px;color:#b9b2a2;padding:4px 0}
.qi span:last-child{color:var(--gold);font-size:11px;font-variant-numeric:tabular-nums}
.qi .qsub{display:block;font-size:9.5px;color:var(--dim2);margin-top:2px}

.note2{background:#1d1712;border:1px solid #4a3a22;border-radius:11px;padding:10px 12px;
  font-size:11px;line-height:1.8;color:#c9a97a;margin-top:10px}

/* ------------------------------------------------------------- overlay */
.ovl{position:fixed;inset:0;background:rgba(5,7,11,.75);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;padding:10px}
.ovl.hidden{display:none}
.sheet{width:100%;max-width:500px;background:#171c26;border:1px solid #2e3648;
  border-radius:20px;padding:17px 15px calc(15px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto}
.sheet .sh{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.sheet .sh .ic2{font-size:22px}
.sheet .sh .nm3{font-size:16px;font-weight:700;flex:1}
.sheet .x{color:var(--dim);font-size:20px;padding:0 6px;background:none;border:0}
.sheet .lede2{font-size:11.5px;color:var(--dim);line-height:1.85;margin-bottom:13px}
.pickg{width:100%;text-align:right;background:var(--panel2);border:1px solid var(--line2);
  border-radius:12px;padding:11px 12px;margin-bottom:7px;font-family:inherit;color:var(--ink)}
.pickg[disabled]{opacity:.45}
.pickg .r1{display:flex;justify-content:space-between;align-items:center}
.pickg .gn{font-size:13.5px}
.pickg .cv{font-size:12px;font-variant-numeric:tabular-nums}
.pickg .r2{font-size:10px;color:var(--dim2);margin-top:4px}
.calc2{background:#10141c;border:1px solid var(--line);border-radius:12px;padding:11px;
  margin-bottom:12px;font-size:12.5px}
.calc2 .cr2{display:flex;justify-content:space-between;padding:3px 0;color:#9aa3b6}
.calc2 .cr2 b{font-variant-numeric:tabular-nums;color:var(--ink)}
.warn2{color:var(--bad);font-size:11.5px;margin-top:9px;line-height:1.8}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#1e2532;
  border:1px solid #3a4457;color:var(--ink);padding:11px 17px;border-radius:12px;font-size:12.5px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;text-align:center;
  max-width:330px;line-height:1.7}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="artdefs"></div>
<div id="app">

  <div class="setup" id="setup">
    <div class="steps" id="steps"></div>
    <div class="body" id="setupBody"></div>
    <div class="foot" id="setupFoot"></div>
  </div>

  <div class="game hidden" id="game">
    <div class="top">
      <div class="trow">
        <div class="date" id="date"></div>
        <div class="clock">
          <button class="cbtn" id="pp" data-clock="pp">▶</button>
          <button class="cbtn" id="sp0" data-clock="0">×١</button>
          <button class="cbtn" id="sp1" data-clock="1">×٢</button>
          <button class="cbtn" id="sp2" data-clock="2">×٣</button>
        </div>
      </div>
      <div class="who" id="who"></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="view" id="view"></div>
    <div class="nav" id="nav"></div>
  </div>

</div>
<div class="ovl hidden" id="ovl"></div>
<div class="toast" id="toast"></div>
<script>/* ============================================================================
   Tab artwork — drawn in code, not photographed.

   Why SVG and not images: the game ships as one offline file, so every
   kilobyte of art is a kilobyte in the APK. These scenes cost almost nothing,
   stay sharp on any screen, and carry no licensing question. If real painted
   art replaces them later it drops into the same band with no other change.

   Each scene is a silhouette with one warm light source, so the five read as
   one place seen from five rooms. IDs are prefixed per scene because several
   of these end up in the same document.
   ========================================================================== */

var ART = {

  /* The office at night: the desk you decide from, and the lamp still on. */
  pres: '<svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'
    + '<defs>'
    + '<radialGradient id="pres-lamp" cx="50%" cy="50%" r="50%">'
    + '<stop offset="0%" stop-color="#e8c87a" stop-opacity=".55"/>'
    + '<stop offset="100%" stop-color="#e8c87a" stop-opacity="0"/></radialGradient>'
    + '<linearGradient id="pres-win" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="#26324a"/><stop offset="100%" stop-color="#141c2c"/></linearGradient>'
    + '</defs>'
    + '<rect x="0" y="0" width="1200" height="400" fill="#10141c"/>'
    + '<rect x="360" y="30" width="480" height="250" rx="4" fill="url(#pres-win)" stroke="#2a3547" stroke-width="3"/>'
    + '<path d="M600,30 L600,280 M360,155 L840,155" stroke="#2a3547" stroke-width="3"/>'
    + '<circle cx="470" cy="90" r="3" fill="#8fa3c4" opacity=".7"/>'
    + '<circle cx="700" cy="70" r="2" fill="#8fa3c4" opacity=".5"/>'
    + '<circle cx="760" cy="120" r="2" fill="#8fa3c4" opacity=".45"/>'
    + '<rect x="150" y="240" width="120" height="140" fill="#161d2b"/>'
    + '<rect x="930" y="240" width="120" height="140" fill="#161d2b"/>'
    + '<circle cx="790" cy="268" r="95" fill="url(#pres-lamp)"/>'
    + '<rect x="520" y="215" width="120" height="90" rx="14" fill="#131924"/>'
    + '<rect x="240" y="300" width="720" height="22" rx="3" fill="#0d1017"/>'
    + '<rect x="268" y="322" width="16" height="58" fill="#0d1017"/>'
    + '<rect x="916" y="322" width="16" height="58" fill="#0d1017"/>'
    + '<rect x="620" y="286" width="86" height="14" rx="2" fill="#1d2534"/>'
    + '<rect x="636" y="278" width="70" height="10" rx="2" fill="#222b3c"/>'

/* Our own generator, seeded from the state, instead of Math.random. Two reasons

function rngFrom(seed) {

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
