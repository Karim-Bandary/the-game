<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>الحُكم</title>
<style>/* One dark theme only: this is a game screen, not a document. Every colour is
   explicit so it never borrows anything from the host page. */
:root{
  --bg:#0d0f14; --panel:#141922; --panel2:#1a1f2b; --line:#232a38; --line2:#2a3040;
  --ink:#e8e3d8; --dim:#7d8697; --dim2:#5d667a;
  --gold:#e8c87a; --gold2:#c9a24b;
  --good:#68d094; --warn:#e8c87a; --bad:#e07575; --info:#6fa8e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  direction:rtl; text-align:right;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}

/* ---------------------------------------------------------------- setup */
.setup{flex:1;display:flex;flex-direction:column;overflow:hidden}
.setup .steps{display:flex;gap:5px;padding:18px 18px 12px;flex:none}
.setup .sp{flex:1;height:3px;background:#1e2431;border-radius:2px;transition:background .3s}
.setup .sp.on{background:var(--gold2)} .setup .sp.done{background:#3d6b52}
.setup .body{flex:1;overflow-y:auto;padding:6px 18px 18px}
.setup .foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex:none;
  border-top:1px solid var(--panel2);display:flex;gap:8px}
.eyebrow{font-size:10px;color:var(--dim);letter-spacing:.12em;margin-bottom:6px}
h1{font-size:21px;font-weight:700;line-height:1.5;margin-bottom:6px}
.lede{font-size:12.5px;color:var(--dim);line-height:1.85;margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:#8b93a5;margin-bottom:7px}
.field .wrap{display:flex;gap:7px}
input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:13px;color:var(--ink);font-family:inherit;font-size:15px;text-align:right;
  -webkit-user-select:text;user-select:text}
input:focus{outline:none;border-color:var(--gold2)}
.dice{flex:0 0 46px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  color:var(--gold2);font-size:17px}
.opt{width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;padding:14px;margin-bottom:9px;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--gold2);background:#191f29}
.opt .hd{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.opt .ic{font-size:20px} .opt .nm{font-size:15.5px;font-weight:700;flex:1}
.opt .tag{font-size:9.5px;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.opt.sel .tag{color:var(--gold);border-color:#4a3f22}
.opt .ds{font-size:11.5px;color:#8b93a5;line-height:1.85;margin-top:6px}
.opt .detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
.opt.sel .detail{max-height:400px}
.lst{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.li{font-size:11.5px;line-height:1.8;display:flex;gap:7px;margin-bottom:5px}
.li b{flex:none;font-weight:400}
.good b{color:var(--good)} .bad b{color:var(--bad)}
.feel{font-size:11px;color:var(--gold2);margin-top:10px;font-style:italic}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid #2c4a38;background:#182620;
  color:#8ee0ab;font-size:15px;font-weight:700}
.btn[disabled]{opacity:.35}
.btn.ghost{flex:0 0 92px;background:var(--panel);border-color:var(--line2);color:var(--dim);
  font-weight:400;font-size:13px}
.btn:active:not([disabled]){transform:scale(.98)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13px}
.srow .v{font-variant-numeric:tabular-nums;font-weight:700}
.srow .d{font-size:10.5px;margin-right:6px}
.up{color:var(--good)} .dn{color:var(--bad)}
.flag{background:#1d1712;border:1px solid #4a3a22;border-radius:11px;padding:10px 12px;
  font-size:11.5px;line-height:1.8;color:#c9a97a;margin-bottom:8px}
.title{background:linear-gradient(180deg,#1e2431,#171c26);border:1px solid #2e3648;border-radius:16px;
  padding:18px 14px;text-align:center;margin-bottom:12px}
.title .cn{font-size:19px;font-weight:700;margin-bottom:4px}
.title .rn{font-size:12px;color:var(--gold)}

/* ---------------------------------------------------------------- game */
.game{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{padding:calc(10px + env(safe-area-inset-top)) 13px 9px;border-bottom:1px solid #1e2431;
  background:var(--panel);flex:none}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:8px}
.date{font-size:12px;color:#8b93a5;white-space:nowrap}
.date b{color:var(--gold);font-size:14px;font-variant-numeric:tabular-nums}
.who{font-size:10.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-bottom:9px}
.clock{display:flex;gap:4px;flex:none}
.cbtn{background:var(--panel2);border:1px solid var(--line2);color:#8b93a5;border-radius:7px;
  padding:4px 8px;font-size:11px;min-width:30px}
.cbtn.on{background:#1e2a22;border-color:#2c4a38;color:#8ee0ab}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mtr{text-align:center}
.mtr .lb{font-size:8.5px;color:var(--dim);display:block;margin-bottom:3px}
.mtr .vl{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-bottom:3px}
.mtr .bar{height:3px;background:#0d1017;border-radius:2px;overflow:hidden}
.mtr .fl{height:100%;border-radius:2px;transition:width .4s,background .4s}
.mtr.danger{animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.view{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #1e2431;
  background:var(--panel);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;padding:9px 2px 11px;color:var(--dim2);font-size:9px;
  display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button i{font-style:normal;font-size:17px;opacity:.5}
.nav button.on{color:var(--gold)} .nav button.on i{opacity:1}
.soon{background:var(--panel);border:1px dashed #3a4457;border-radius:14px;padding:22px 16px;text-align:center}
.soon .ic{font-size:30px;display:block;margin-bottom:10px;opacity:.8}
.soon h3{font-size:15px;margin-bottom:7px}
.soon p{font-size:12px;color:var(--dim);line-height:1.9;max-width:34ch;margin:0 auto}
.soon .item{display:inline-block;margin-top:12px;font-size:10.5px;color:var(--gold2);
  border:1px solid #4a3f22;border-radius:20px;padding:3px 11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}
.card h3{font-size:14px;margin-bottom:8px}
.krow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#9aa3b6}
.krow b{color:var(--ink);font-variant-numeric:tabular-nums}
.log{font-size:11.5px;color:var(--dim);line-height:1.9;border-right:2px solid var(--line2);
  padding-right:10px;margin-bottom:7px}
</style>
</head>
<body>
<div id="app">

  <div class="setup" id="setup">
    <div class="steps" id="steps"></div>
    <div class="body" id="setupBody"></div>
    <div class="foot" id="setupFoot"></div>
  </div>

  <div class="game hidden" id="game">
    <div class="top">
      <div class="trow">
        <div class="date" id="date"></div>
        <div class="clock">
          <button class="cbtn" id="pp" data-clock="pp">▶</button>
          <button class="cbtn" id="sp0" data-clock="0">×١</button>
          <button class="cbtn" id="sp1" data-clock="1">×٢</button>
          <button class="cbtn" id="sp2" data-clock="2">×٣</button>
        </div>
      </div>
      <div class="who" id="who"></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="view" id="view"></div>
    <div class="nav" id="nav"></div>
  </div>

</div>
<script>/* ============================================================================
   The engine. No DOM here — only state and rules.
   Kept separate from the UI so the same month loop can later be driven by the
   balance simulator without a browser, and so a UI bug can never be a rules bug.
   ========================================================================== */

var BALANCE = {"_note": "كل الفلوس بالمليون. كل المؤشرات من 0 إلى 100 إلا التضخم (نسبة سنوية).", "start": {"treasury": 2400, "inflation": 6.0, "tax_rate": 20, "utility_price": 50, "food_subsidy": 60, "budget_pct": 118, "minister_competence": 65, "admin_salaries": 180, "population_millions": 12.0}, "governorates": {"capital": {"name": "العاصمة", "population": 4.2, "wealth": 1.3, "youth": 0.85, "facilities": {"water": 3, "power": 2, "sewage": 2, "health": 4, "edu": 5, "police": 6, "fire": 4}}, "industrial": {"name": "الصناعية", "population": 2.4, "wealth": 1.1, "youth": 1.0, "facilities": {"water": 2, "power": 1, "sewage": 1, "health": 2, "edu": 3, "police": 3, "fire": 2}}, "agri": {"name": "الزراعية", "population": 2.2, "wealth": 0.8, "youth": 1.05, "facilities": {"water": 1, "power": 1, "sewage": 1, "health": 2, "edu": 2, "police": 2, "fire": 2}}, "south": {"name": "الجنوب", "population": 2.6, "wealth": 0.6, "youth": 1.35, "facilities": {"water": 1, "power": 1, "sewage": 1, "health": 1, "edu": 3, "police": 3, "fire": 1}}, "border": {"name": "الحدودية", "population": 0.6, "wealth": 0.75, "youth": 1.0, "facilities": {"water": 1, "power": 1, "sewage": 0, "health": 1, "edu": 1, "police": 1, "fire": 1}}}, "services": {"water": {"name": "المياه", "serves_millions": 1.5, "monthly_ask": 60, "build_cost": 520, "build_months": 6, "adds_monthly": 9, "approval_weight": 0.16}, "power": {"name": "الكهربا", "serves_millions": 1.8, "monthly_ask": 105, "build_cost": 900, "build_months": 11, "adds_monthly": 16, "approval_weight": 0.15}, "sewage": {"name": "الصرف", "serves_millions": 2.0, "monthly_ask": 45, "build_cost": 610, "build_months": 9, "adds_monthly": 8, "approval_weight": 0.11}, "health": {"name": "الصحة", "serves_millions": 1.0, "monthly_ask": 82, "build_cost": 400, "build_months": 8, "adds_monthly": 7, "approval_weight": 0.17}, "edu": {"name": "التعليم", "serves_millions": 0.6, "monthly_ask": 95, "build_cost": 180, "build_months": 4, "adds_monthly": 6, "approval_weight": 0.14}, "police": {"name": "الشرطة", "serves_millions": 0.5, "monthly_ask": 58, "build_cost": 150, "build_months": 3, "adds_monthly": 5, "approval_weight": 0.15}, "fire": {"name": "الإسعاف", "serves_millions": 0.5, "monthly_ask": 35, "build_cost": 120, "build_months": 3, "adds_monthly": 4, "approval_weight": 0.12}}, "income": {"income_tax_coef": 2.3, "corporate_tax_coef": 33.0, "utility_bills_coef": 22.0, "formula": "الدخل = مؤشر الأسعار × (سكان×2.30×الضريبة×كفاءة المالية + سكان×33×(الكهربا÷60)×كفاءة المالية + سكان×22×(سعر الفواتير÷50))"}, "food": {"agri_yield": 11.0, "world_price": 28, "consumption_per_million": 1.0, "price_smoothing": 0.55, "formula": "الإنتاج = 11 × (مستوى مياه الزراعية ÷ 60) · العجز = السكان − الإنتاج"}, "inflation": {"monthly_decay": 0.08, "floor": 3.0, "deficit_penalty": 1.4, "collapse_at": 150.0, "pain_starts_above": 9.0, "pain_coef": 1.5, "print_350_adds": 2.2}, "mood": {"smoothing": 0.3, "stability_smoothing": 0.22, "tax_pain_coef": 1.6, "tax_pain_free_below": 18, "utility_pain_coef": 0.8, "food_pain_coef": 0.85, "approval_danger": 35, "stability_danger": 40, "boil_cap": 100, "boil_cooldown": 7}, "population": {"monthly_growth_base": 0.0018, "health_penalty_coef": 0.001}};
var SETUP   = {"government_types": [{"id": "monarchy", "ic": "👑", "nm": "ملكي", "tag": "الشرعية موروثة", "desc": "إنت ملك. الناس مش لازم تحبك عشان تفضل في الكرسي — بس تغيير أي حاجة صعب.", "mods": {"stability": 12, "ap": -1}, "good": ["ثبات سياسي بيبدأ أعلى بـ١٢", "الغليان بيتراكم أبطأ ١٥٪", "العزل محتاج أزمة أكبر بكتير"], "bad": ["طاقة قرارات أقل (٥) — البلاط والتقاليد بيقيدوك", "الشباب والحزب الحديث بيبدأوا غاضبين", "عزل أي وزير بيكلف ثبات ×١.٥"], "feel": "لعبة بطيئة ومستقرة. بتعيش طويل، بس بتتحرك ببطء."}, {"id": "republic", "ic": "🗳️", "nm": "جمهوري", "tag": "شرعيتك من الصندوق", "desc": "دولة بمؤسسات. الجهاز بيشتغل أحسن — بس فيه انتخابات كل ٤ سنين، والرضا وقتها هو كل حاجة.", "mods": {"competence": 8}, "good": ["كفاءة الوزرا +٨ — التعيين مؤسسي مش مزاجي", "دخل الضرايب +٨٪ (جهاز تحصيل منظم)", "الفضيحة الواحدة مش بتوديك — المؤسسات بتمتص"], "bad": ["🗳️ انتخابات كل ٤ سنين — رضاك تحت ٤٠ يوم الانتخابات = خرجت", "نفوذ الأحزاب +١٥٪", "الإعلام أحر → الفضايح بتنتشر أسرع"], "feel": "لعبة بإيقاع. أربع سنين شغل، وامتحان."}, {"id": "dictator", "ic": "🎖️", "nm": "ديكتاتوري", "tag": "شرعيتك من الجيش", "desc": "كل السلطة في إيدك. الأحزاب ضعيفة والإعلام مقموع — والجيش هو الحاجة الوحيدة اللي بتخاف منها.", "mods": {"ap": 2, "approval": -10}, "good": ["طاقة قرارات ٨ — تعمل اللي إنت عايزه", "القمع بينجح أكتر ٣٠٪", "نفوذ الأحزاب −٤٠٪", "احتمال الفضيحة ×٠.٦ — الإعلام مقفول"], "bad": ["الرضا بيبدأ −١٠ وبينزل لوحده كل شهر", "دخل الشركات −١٥٪ — مفيش استثمار", "⚠️ لو رضا الجيش نزل تحت ٣٠ → انقلاب فوري ونهاية تالتة"], "feel": "لعبة قوة وخوف. بتقدر على كل حاجة إلا حاجة واحدة."}], "society_types": [{"id": "conservative", "ic": "🕌", "nm": "مجتمع محافظ", "tag": "بطيء ومستقر", "desc": "مجتمع متماسك بيقدّر الاستقرار. بيسامحك كتير — لو ما حاولتش تغيّره.", "mods": {"stability": 8}, "good": ["ثبات +٨", "الغليان بيتراكم أبطأ ١٥٪", "كتلة المتدينين أكبر — ولو راضية بتهدّي الباقي"], "bad": ["كل إصلاح كبير بيكلف ضعف الرضا", "التعليم أثره على الاقتصاد أقل ٢٠٪"]}, {"id": "open", "ic": "🏙️", "nm": "مجتمع مدني منفتح", "tag": "بينمو وبيراقب", "desc": "مجتمع متعلم وبيتحرك بسرعة. بيبني لك اقتصاد قوي — وبيمسك عليك كل غلطة.", "mods": {"competence": 6}, "good": ["التعليم أثره +٣٠٪ على الدخل طويل المدى", "دخل الشركات +١٢٪", "كفاءة الوزرا +٦"], "bad": ["الفضيحة بتنتشر ×١.٥ — الإعلام حر", "كتلة الشباب أكبر وبتنزل الشارع أسرع"]}, {"id": "tribal", "ic": "🪶", "nm": "مجتمع قبلي عشائري", "tag": "ولاء بدل كفاءة", "desc": "الولاء هنا أهم من الشهادة. رجالتك مخلصين لك — ومش شاطرين.", "mods": {"loyalty": 15, "competence": -12}, "good": ["ولاء الوزرا بيبدأ +١٥", "رشوة الجيش أرخص ٣٠٪", "المحافظات البعيدة أهدى"], "bad": ["كفاءة الوزرا −١٢ — محسوبية", "لو بنيت في محافظة كتير، الباقيين بيغاروا ورضاهم ينزل"]}, {"id": "divided", "ic": "⚡", "nm": "مجتمع منقسم", "tag": "صعب — للمرة التانية", "desc": "مجتمع مشقوق لنصين. خصومك مش متفقين على حاجة — ولا شعبك كمان.", "mods": {"approval": -6}, "good": ["الأحزاب مش بتتحد ضدك", "تقدر تلعب طرف ضد طرف — التفاوض أرخص"], "bad": ["كل أزمة بتكبر ×١.٤", "الرضا بيبدأ −٦ والغليان بيتراكم أسرع"]}], "base_start": {"approval": 52, "stability": 68, "treasury": 2400, "ap": 6, "inflation": 6.0, "competence": 65, "loyalty": 65}, "suggested_country_names": ["جمهورية النهر", "دولة السواحل", "بلاد الرمال", "اتحاد الوديان", "مملكة الشمال", "دولة المرتفعات", "بلاد النخيل"], "suggested_ruler_names": ["كريم عبد الحكم", "سليم الفارس", "عادل بن راشد", "نور الدين حلمي", "طارق العامري", "مراد الشريف"]};

/* Speeds are seconds of real time per in-game month. Slow is deliberately slow:
   the player should have time to read a screen before the month turns. */
var SPEEDS = [6.0, 3.0, 1.5];

function clamp(v, lo, hi) { return Math.max(lo === undefined ? 0 : lo, Math.min(hi === undefined ? 100 : hi, v)); }

/* Build the starting state from the player's setup choices.
   Everything the game needs lives on this one plain object, so saving the game
   later is JSON.stringify(S) and nothing more. */
function newGame(choice) {
  var b = BALANCE.start;
  var S = {
    version: 1,
    country: choice.country,
    ruler: choice.ruler,
    govId: choice.gov.id,
    socId: choice.soc.id,
    month: 1,            // 1..12
    year: 1,
    totalMonths: 0,      // months survived — the score
    approval: SETUP.base_start.approval,
    stability: SETUP.base_start.stability,
    inflation: b.inflation,
    priceIndex: 1.0,
    treasury: b.treasury,
    personal: 0,
    ap: SETUP.base_start.ap,
    apMax: SETUP.base_start.ap,
    competence: SETUP.base_start.competence,
    loyalty: SETUP.base_start.loyalty,
    log: []
  };
  // Government and society are modifiers, never separate content. Applying them
  // here is the only place they touch the state.
  [choice.gov, choice.soc].forEach(function (opt) {
    for (var k in opt.mods) if (S[k] !== undefined) S[k] += opt.mods[k];
  });
  S.apMax = S.ap;
  S.approval = clamp(S.approval);
  S.stability = clamp(S.stability);
  return S;
}

/* Events carry DATA, never text. The engine must not decide how a number is
   written — that is the UI's job, and mixing the two put Latin digits on an
   Arabic screen once already. */

/* The whole month, in one function.
   Whatever calls this — a timer, a button, or elapsed offline time — is not the
   engine's business. That separation is what lets us change how time flows
   without touching a single rule. Returns the events the UI should react to. */
function tickMonth(S) {
  var events = [];

  S.totalMonths += 1;
  S.month += 1;
  if (S.month > 12) { S.month = 1; S.year += 1; events.push({ type: 'year', year: S.year }); }

  // Prices drift with inflation every month; the rest of the economy lands in
  // item 7 and reads this index rather than raw numbers.
  S.priceIndex *= 1 + (S.inflation / 100) / 12;

  S.ap = S.apMax;                       // action points refill each month

  return events;
}

/* ---- helpers the UI needs but that are rules, not presentation ---------- */

function govOf(S) {
  return SETUP.government_types.filter(function (g) { return g.id === S.govId; })[0];
}
function socOf(S) {
  return SETUP.society_types.filter(function (s) { return s.id === S.socId; })[0];
}

/* A meter is in danger below the balance file's own thresholds, so the warning
   the player sees and the number the simulator uses can never disagree. */
function danger(S) {
  return {
    approval: S.approval < BALANCE.mood.approval_danger,
    stability: S.stability < BALANCE.mood.stability_danger,
    inflation: S.inflation > BALANCE.inflation.pain_starts_above
  };
}
</script>
<script>/* ============================================================================
   The screens. Reads the engine's state, never changes the rules.
   ========================================================================== */

var AR = '٠١٢٣٤٥٦٧٨٩';
function ar(n) {
  return String(Math.round(n)).replace(/-/g, '−').replace(/\d/g, function (d) { return AR[+d]; });
}
/* Decimals need the same digits as everything else, or one number on the screen
   is suddenly in a different script from its neighbours. */
function arDec(n, places) {
  return n.toFixed(places).replace(/\./g, '٫').replace(/\d/g, function (d) { return AR[+d]; });
}
function el(id) { return document.getElementById(id); }

var S = null;                 // the game state, null while in setup
var tab = 'pres';
var running = false;
var speed = 0;
var timer = null;
var setupState = { step: 0, country: '', ruler: '', gov: null, soc: null };

/* ------------------------------------------------------------------ setup */
function setupView() {
  var st = setupState;
  if (st.step === 0) {
    return '<div class="eyebrow">الخطوة ١ من ٤</div><h1>دولتك</h1>'
      + '<p class="lede">دولة خيالية، وحاكم من اختيارك. الأسماء دي هتظهر في كل مكان في اللعبة وفي شاشة النهاية.</p>'
      + '<div class="field"><label>اسم الدولة</label><div class="wrap">'
      + '<input id="cn" value="' + esc(st.country) + '" placeholder="اكتب اسم دولتك">'
      + '<button class="dice" data-roll="country">🎲</button></div></div>'
      + '<div class="field"><label>اسمك كحاكم</label><div class="wrap">'
      + '<input id="rn" value="' + esc(st.ruler) + '" placeholder="اكتب اسمك">'
      + '<button class="dice" data-roll="ruler">🎲</button></div></div>'
      + '<div class="flag">💡 لو سيبتهم فاضيين، اللعبة هتختار لك أسماء.</div>';
  }
  if (st.step === 1) {
    return '<div class="eyebrow">الخطوة ٢ من ٤</div><h1>نظام الحكم</h1>'
      + '<p class="lede">ده مش شكل بس — ده بيغيّر مصدر شرعيتك، يعني بيغيّر الحاجة اللي ممكن تسقطك.</p>'
      + optionList(SETUP.government_types, st.gov, 'gov');
  }
  if (st.step === 2) {
    return '<div class="eyebrow">الخطوة ٣ من ٤</div><h1>طبيعة المجتمع</h1>'
      + '<p class="lede">الناس اللي هتحكمهم. ده بيحدد إيه اللي بيغضبهم، وقد إيه بيسامحوا.</p>'
      + optionList(SETUP.society_types, st.soc, 'soc');
  }
  return summaryView();
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function optionList(list, current, key) {
  return list.map(function (o, i) {
    var sel = current && current.id === o.id;
    var h = '<button class="opt' + (sel ? ' sel' : '') + '" data-pick="' + key + '" data-i="' + i + '">'
      + '<div class="hd"><span class="ic">' + o.ic + '</span><span class="nm">' + o.nm + '</span>'
      + '<span class="tag">' + o.tag + '</span></div>'
      + '<p class="ds">' + o.desc + '</p><div class="detail"><div class="lst">';
    h += o.good.map(function (g) { return '<div class="li good"><b>▲</b><span>' + g + '</span></div>'; }).join('');
    h += o.bad.map(function (g) { return '<div class="li bad"><b>▼</b><span>' + g + '</span></div>'; }).join('');
    if (o.feel) h += '<div class="feel">' + o.feel + '</div>';
    return h + '</div></div></button>';
  }).join('');
}

/* Showing the resulting numbers BEFORE the game starts is the point of the
   setup: the player should feel the trade-off, not discover it in year three. */
function summaryView() {
  var st = setupState, base = SETUP.base_start, v = {}, d = {};
  for (var k in base) v[k] = base[k];
  [st.gov, st.soc].forEach(function (o) {
    if (!o) return;
    for (var k in o.mods) { v[k] += o.mods[k]; d[k] = (d[k] || 0) + o.mods[k]; }
  });
  function row(label, key, suffix) {
    var delta = d[key] ? '<span class="d ' + (d[key] > 0 ? 'up' : 'dn') + '">'
      + (d[key] > 0 ? '▲+' : '▼') + ar(Math.abs(d[key])) + '</span>' : '';
    return '<div class="srow"><span>' + label + '</span><span class="v">'
      + ar(v[key]) + (suffix || '') + delta + '</span></div>';
  }
  var h = '<div class="eyebrow">الخطوة ٤ من ٤</div><h1>قبل ما تبدأ</h1>'
    + '<p class="lede">دي حالة دولتك يوم ما تمسك الحكم — بعد ما اختياراتك اتحسبت.</p>'
    + '<div class="title"><div class="cn">' + esc(st.country || 'دولة بلا اسم') + '</div>'
    + '<div class="rn">' + (st.gov ? st.gov.ic + ' ' : '') + esc(st.ruler || 'حاكم بلا اسم') + '</div></div>'
    + '<div class="sum">'
    + row('الرضا الشعبي', 'approval') + row('الثبات السياسي', 'stability')
    + row('كفاءة الوزرا', 'competence') + row('ولاء الوزرا', 'loyalty')
    + row('طاقة القرارات', 'ap') + row('التضخم', 'inflation', '٪')
    + '<div class="srow"><span>الخزينة</span><span class="v">' + ar(BALANCE.start.treasury) + 'م</span></div>'
    + '</div>';
  if (st.gov && st.gov.id === 'republic') h += '<div class="flag">🗳️ أول انتخابات بعد ٤٨ شهر. لو رضاك وقتها تحت ٤٠، خرجت.</div>';
  if (st.gov && st.gov.id === 'dictator') h += '<div class="flag">⚠️ رضا الجيش تحت ٣٠ = انقلاب فوري. راقب وزير الدفاع.</div>';
  if (st.gov && st.gov.id === 'monarchy') h += '<div class="flag">👑 مفيش انتخابات ومفيش مدة. بتفضل لحد ما يشيلوك.</div>';
  if (st.soc && st.soc.id === 'divided') h += '<div class="flag">⚡ الوضع الصعب. ما تلعبهوش أول مرة.</div>';
  return h;
}

function setupFoot() {
  var st = setupState;
  var ok = st.step === 1 ? !!st.gov : st.step === 2 ? !!st.soc : true;
  return (st.step > 0 ? '<button class="btn ghost" data-nav="back">⟶ رجوع</button>' : '')
    + '<button class="btn" data-nav="next"' + (ok ? '' : ' disabled') + '>'
    + (st.step === 3 ? 'ابدأ الحُكم ⟵' : 'التالي ⟵') + '</button>';
}

function drawSetup() {
  var h = '';
  for (var i = 0; i < 4; i++) h += '<div class="sp ' + (i < setupState.step ? 'done' : i === setupState.step ? 'on' : '') + '"></div>';
  el('steps').innerHTML = h;
  el('setupBody').innerHTML = setupView();
  el('setupFoot').innerHTML = setupFoot();
}

/* ------------------------------------------------------------------- game */
var TABS = [['pres', '🏛️', 'الرئاسة'], ['treas', '💰', 'الخزينة'], ['serv', '🏗️', 'الخدمات'],
            ['govt', '👔', 'الحكومة'], ['pol', '⚖️', 'السياسة']];

/* Each tab names the plan item that fills it. Blind building means Karim must
   be able to see what is done and what is not without asking. */
var SOON = {
  pres: ['🏛️', 'الرئاسة', 'المواقف اللي بتيجي لك، ومكتب الرئاسة والأفعال اللي بتبدأها إنت.', 'البند ١٢'],
  treas: ['💰', 'الخزينة', 'الدخل والمصروف والضرايب وأسعار الخدمات ودعم الغذاء.', 'البند ٨'],
  serv: ['🏗️', 'الخدمات', 'السبع خدمات، التشغيل والبناء، وفلتر المحافظات الخمسة.', 'البند ٧'],
  govt: ['👔', 'الحكومة', 'رئيس الوزراء والوزرا التمنية، الولاء والكفاءة، والبنك المركزي.', 'البند ١٠'],
  pol: ['⚖️', 'السياسة', 'الأحزاب الأربعة والكتل الاجتماعية الخمسة والصراع بينهم.', 'البند ١٣']
};

function meterColor(v) { return v >= 65 ? 'var(--good)' : v >= 45 ? 'var(--warn)' : 'var(--bad)'; }

function drawTop() {
  var g = govOf(S), dg = danger(S);
  el('date').innerHTML = 'الشهر <b>' + ar(S.month) + '</b> · السنة <b>' + ar(S.year) + '</b>';
  el('who').textContent = g.ic + ' ' + S.ruler + ' — ' + S.country;
  var m = [
    ['الرضا', S.approval, meterColor(S.approval), ar(S.approval), dg.approval],
    ['الثبات', S.stability, meterColor(S.stability), ar(S.stability), dg.stability],
    ['التضخم', Math.min(100, S.inflation * 2), dg.inflation ? 'var(--bad)' : 'var(--good)', ar(S.inflation) + '٪', dg.inflation],
    ['الطاقة', S.ap / S.apMax * 100, 'var(--info)', ar(S.ap) + '/' + ar(S.apMax), false]
  ];
  el('meters').innerHTML = m.map(function (x) {
    return '<div class="mtr' + (x[4] ? ' danger' : '') + '"><span class="lb">' + x[0] + '</span>'
      + '<span class="vl" style="color:' + x[2] + '">' + x[3] + '</span>'
      + '<div class="bar"><div class="fl" style="width:' + Math.max(0, Math.min(100, x[1])) + '%;background:' + x[2] + '"></div></div></div>';
  }).join('');
}

function drawNav() {
  el('nav').innerHTML = TABS.map(function (t) {
    return '<button class="' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '"><i>' + t[1] + '</i>' + t[2] + '</button>';
  }).join('');
}

function drawView() {
  var h = '';
  if (tab === 'pres') {
    var g = govOf(S), s = socOf(S);
    h += '<div class="card"><h3>' + esc(S.country) + '</h3>'
      + '<div class="krow"><span>نظام الحكم</span><b>' + g.ic + ' ' + g.nm + '</b></div>'
      + '<div class="krow"><span>طبيعة المجتمع</span><b>' + s.ic + ' ' + s.nm + '</b></div>'
      + '<div class="krow"><span>شهور في الحكم</span><b>' + ar(S.totalMonths) + '</b></div>'
      + '<div class="krow"><span>الخزينة</span><b>' + ar(S.treasury) + 'م</b></div>'
      + '<div class="krow"><span>مؤشر الأسعار</span><b>×' + arDec(S.priceIndex, 2) + '</b></div></div>';
    if (S.log.length) {
      h += '<div class="card"><h3>آخر الأخبار</h3>'
        + S.log.slice(-6).reverse().map(function (l) { return '<div class="log">' + l + '</div>'; }).join('')
        + '</div>';
    }
  }
  var k = SOON[tab];
  h += '<div class="soon"><span class="ic">' + k[0] + '</span><h3>' + k[1] + '</h3>'
    + '<p>' + k[2] + '</p><span class="item">لسه بيتبني — ' + k[3] + '</span></div>';
  el('view').innerHTML = h;
}

function drawClock() {
  el('pp').textContent = running ? '⏸' : '▶';
  el('pp').className = 'cbtn' + (running ? ' on' : '');
  for (var i = 0; i < 3; i++) el('sp' + i).className = 'cbtn' + (speed === i ? ' on' : '');
}

function drawGame() { drawTop(); drawNav(); drawView(); drawClock(); }

/* ------------------------------------------------------------------ clock */
/* The timer is the only thing that knows about real time. tickMonth() has no
   idea it exists, which is what makes the time model swappable later. */
function schedule() {
  if (timer) { clearInterval(timer); timer = null; }
  if (running) timer = setInterval(step, SPEEDS[speed] * 1000);
}
function setRunning(v) { running = v; schedule(); drawClock(); }
/* Turns an engine event into a line the player reads. Every number goes through
   ar() here, so nothing can reach the screen in Latin digits. */
function eventText(e) {
  if (e.type === 'year') return 'بدأت السنة ' + ar(e.year) + '.';
  return e.text || '';
}

function step() {
  var events = tickMonth(S);
  events.forEach(function (e) {
    var line = eventText(e);
    if (line) S.log.push(line);
  });
  // Anything the player must see stops the clock. Later this is where a crisis,
  // a scandal or a finished project will pause the game for a decision.
  if (events.length) setRunning(false);
  drawGame();
}

/* ----------------------------------------------------------------- events */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-pick],[data-nav],[data-roll],[data-tab],[data-clock]');
  if (!t) return;
  if (t.dataset.pick) {
    var list = t.dataset.pick === 'gov' ? SETUP.government_types : SETUP.society_types;
    setupState[t.dataset.pick] = list[+t.dataset.i];
    drawSetup();
  } else if (t.dataset.roll) {
    var names = t.dataset.roll === 'country' ? SETUP.suggested_country_names : SETUP.suggested_ruler_names;
    setupState[t.dataset.roll] = names[Math.floor(Math.random() * names.length)];
    drawSetup();
  } else if (t.dataset.nav) {
    captureNames();
    if (t.dataset.nav === 'back') { setupState.step--; drawSetup(); }
    else if (setupState.step < 3) { setupState.step++; drawSetup(); }
    else startGame();
  } else if (t.dataset.tab) {
    tab = t.dataset.tab; drawNav(); drawView();
  } else if (t.dataset.clock === 'pp') {
    setRunning(!running);
  } else if (t.dataset.clock) {
    speed = +t.dataset.clock; schedule(); drawClock();
  }
});

function captureNames() {
  var c = el('cn'), r = el('rn');
  if (c) setupState.country = c.value.trim();
  if (r) setupState.ruler = r.value.trim();
}

function startGame() {
  if (!setupState.country) setupState.country = SETUP.suggested_country_names[0];
  if (!setupState.ruler) setupState.ruler = SETUP.suggested_ruler_names[0];
  S = newGame(setupState);
  S.log.push('بدأ حكم ' + S.ruler + ' في ' + S.country + '.');
  el('setup').classList.add('hidden');
  el('game').classList.remove('hidden');
  drawGame();
}

drawSetup();
</script>
</body>
</html>
